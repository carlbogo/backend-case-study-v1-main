[project]
name = "backend-case-study"
version = "0.1.0"
description = "Backend for a CV workspace"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "click>=8.1.0",
    "fastapi>=0.130.0",
    "openai>=3.6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.20",
    "rich>=14.1.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "sqlmodel>=0.0.24",
    "typer>=0.16.0",
    "typing-extensions>=4.14.1",
    "uvicorn[standard]>=0.35.0",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportPossiblyUnboundVariable = "error"
include = ["src", "server.py", "_cli", "cli.py"]
exclude = ["**/__pycache__", ".venv"]
reportIncompatibleMethodOverride = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: requires TEST_DB_URL pointing to a local disposable PostgreSQL database with the initial schema applied",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
