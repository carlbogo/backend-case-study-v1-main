services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: case_study
      POSTGRES_PASSWORD: case_study
      POSTGRES_DB: case_study
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_study -d case_study"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  postgres_data:
